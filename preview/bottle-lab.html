<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>点眼ボトルの押し方を確かめる</title>
<style>
:root{--ink:#203735;--muted:#5a716d;--paper:#f2f4ef;--accent:#176d61;--line:#c9d6cc;--drop:#aa5838}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,"Yu Gothic",sans-serif}main{max-width:1100px;margin:42px auto;padding:0 24px}h1{font-size:28px;font-weight:500}p{line-height:1.7;color:var(--muted)}a{color:var(--accent)}form{display:flex;gap:20px;flex-wrap:wrap;padding:24px 0;border-block:1px solid var(--line)}label{display:grid;gap:8px;font-size:14px}input{width:145px;padding:10px;border:1px solid var(--line);font:inherit}button{padding:12px 20px;background:var(--accent);color:white;border:0;font:inherit;cursor:pointer}button:disabled{opacity:.6}button:focus-visible,input:focus-visible{outline:3px solid #b77035;outline-offset:3px}.presets{display:flex;gap:12px;margin:20px 0}.presets button{background:transparent;color:var(--accent);border:1px solid var(--line)}#result{font-size:21px;margin:24px 0}#plots{display:grid;grid-template-columns:1fr 1fr;gap:20px}figure{margin:0;background:white;border:1px solid var(--line);padding:16px}figcaption{margin-bottom:12px;font-size:14px}svg{width:100%;height:auto}footer{margin:24px 0;font-size:13px;color:var(--muted)}@media(max-width:700px){#plots{grid-template-columns:1fr}}
</style><main><a href="/">← 人物とロボットの画面へ</a><h1>点眼ボトルの押し方を確かめる</h1>
<p>同じ容器でも、押す量・速さ・戻し方によって滴が出る時刻と数が変わります。操作を設定し、押圧開始から解除後3秒までを計算します。</p>
<div class="presets"><button type="button" data-preset="light">軽く押す</button><button type="button" data-preset="deep">深く押す</button><button type="button" data-preset="delay">ゆっくり戻す</button></div>
<form id="trial"><label>押し込み目標（mm）<input name="target_mm" type="number" min="0" max="3" step=".05" value="2" required></label><label>押す速さ（mm/秒）<input name="press_speed_mm_s" type="number" min=".1" max="10" step=".1" value="2" required></label><label>戻す速さ（mm/秒）<input name="release_speed_mm_s" type="number" min=".1" max="10" step=".1" value="2" required></label><label>押圧指令を保つ時間（秒）<input name="hold_s" type="number" min=".1" max="5" step=".05" value="2" required></label><button id="run">試す</button></form>
<div id="result" role="status">操作を設定して「試す」を押してください。</div><div id="plots"></div>
<footer>学習用の簡略モデル・AI操作ではありません。係数は実ボトルの測定値ではなく、圧力や滴下量の実製品への適合は未検証です。<br>破線＝解除指令、茶色の縦線＝滴が離れた時刻。滴は1回30µLの仮定。最後の滴だけでなく余分な滴も数えます。人物の画面は従来の固定時間診断です。</footer>
<script type="module" src="./bottle-lab.js"></script></main></html>
